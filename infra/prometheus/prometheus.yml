global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "uc2_fire_smoke"
    metrics_path: /metrics
    static_configs:
      - targets: ["uc2_fire_smoke:8030"]

  - job_name: "ingestion"
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestion:8020"]
