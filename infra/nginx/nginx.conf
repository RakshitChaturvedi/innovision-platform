events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Dynamic upstream definitions
    upstream auth_backend {
        server auth:8000;
    }

    upstream camera_registry_backend {
        server camera_registry:8011;
    }

    upstream ingestion_backend {
        server ingestion:8020;
    }

    upstream alert_management_backend {
        server alert_management:8000;
    }

    upstream incident_management_backend {
        server incident_management:8000;
    }

    upstream audit_backend {
        server audit:8000;
    }

    upstream uc3_backend {
        server uc3:8023;
    }

    upstream reporting_backend {
        server reporting:8000;
    }

    upstream notification_backend {
        server notification:8000;
    }

    server {
        listen 80;

        # Healthcheck endpoint
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # Ingestion Video Stream
        location /stream/ {
            proxy_pass http://ingestion_backend/stream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Auth Service API
        location /api/v1/auth/ {
            proxy_pass http://auth_backend/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Camera Registry API
        location /api/v1/cameras {
            proxy_pass http://camera_registry_backend/cameras;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/cameras(.*)$ /api/v1/cameras$1;
            proxy_redirect ~^http://[^/]+/cameras(.*)$ /api/v1/cameras$1;
        }

        # Analytics Catalog API
        location /api/v1/analytics {
            proxy_pass http://camera_registry_backend/analytics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/analytics(.*)$ /api/v1/analytics$1;
            proxy_redirect ~^http://[^/]+/analytics(.*)$ /api/v1/analytics$1;
        }

        # Organizations API
        location /api/v1/organizations {
            proxy_pass http://camera_registry_backend/organizations;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/organizations(.*)$ /api/v1/organizations$1;
            proxy_redirect ~^http://[^/]+/organizations(.*)$ /api/v1/organizations$1;
        }

        # Alert Management API
        location /api/v1/alerts {
            proxy_pass http://alert_management_backend/alerts;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/alerts(.*)$ /api/v1/alerts$1;
            proxy_redirect ~^http://[^/]+/alerts(.*)$ /api/v1/alerts$1;
        }

        # Incident Management API
        location /api/v1/incidents {
            proxy_pass http://incident_management_backend/incidents;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/incidents(.*)$ /api/v1/incidents$1;
            proxy_redirect ~^http://[^/]+/incidents(.*)$ /api/v1/incidents$1;
        }

        # Audit API
        location /api/v1/audit {
            proxy_pass http://audit_backend/audit;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/audit(.*)$ /api/v1/audit$1;
            proxy_redirect ~^http://[^/]+/audit(.*)$ /api/v1/audit$1;
        }

        # Settings API
        location /api/v1/settings {
            proxy_pass http://audit_backend/settings;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/settings(.*)$ /api/v1/settings$1;
            proxy_redirect ~^http://[^/]+/settings(.*)$ /api/v1/settings$1;
        }

        # UC3 Detection & Overlay API
        location /api/v1/uc3 {
            proxy_pass http://uc3_backend/uc3;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/uc3(.*)$ /api/v1/uc3$1;
            proxy_redirect ~^http://[^/]+/uc3(.*)$ /api/v1/uc3$1;
        }

        # Reporting API
        location /api/v1/reports {
            proxy_pass http://reporting_backend/reports;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/reports(.*)$ /api/v1/reports$1;
            proxy_redirect ~^http://[^/]+/reports(.*)$ /api/v1/reports$1;
        }

        # Notification API
        location /api/v1/notifications {
            proxy_pass http://notification_backend/notifications;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect ~^/notifications(.*)$ /api/v1/notifications$1;
            proxy_redirect ~^http://[^/]+/notifications(.*)$ /api/v1/notifications$1;
        }

        # Socket.IO Realtime Connections
        location /socket.io/ {
            proxy_pass http://alert_management_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}