services:
  uc1_stub:
    build:
      context: ..
      dockerfile: stubs/uc1_stub/Dockerfile
    env_file: ../.env
    environment:
      UC_ID: uc1
      TEST_CAMERA_ID: "00000000-0000-0000-0000-000000000001"
      ALERT_INTERVAL_SECONDS: "10"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  uc2_stub:
    build:
      context: ..
      dockerfile: stubs/uc2_stub/Dockerfile
    ports:
      - "8030:8030"
    env_file: ../.env
    environment:
      UC_ID: uc2
      UC2_PORT: "8030"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      CAMERA_REGISTRY_URL: http://camera_registry:8011
      TEST_CAMERA_ID: "00000000-0000-0000-0000-000000000002"
      ALERT_INTERVAL_SECONDS: "15"
      UC2_STREAM_GROUP: uc2_fire_smoke_cg
      UC2_CONF_THRESHOLD: "0.20"
      UC2_TEMPORAL_FRAMES: "3"
      UC2_ALERT_COOLDOWN_S: "30"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  uc3_stub:
    build:
      context: ..
      dockerfile: stubs/uc3_stub/Dockerfile
    env_file: ../.env
    environment:
      UC_ID: uc3
      TEST_CAMERA_ID: "00000000-0000-0000-0000-000000000003"
      ALERT_INTERVAL_SECONDS: "12"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  uc4_stub:
    build:
      context: ..
      dockerfile: stubs/uc4_stub/Dockerfile
    env_file: ../.env
    environment:
      UC_ID: uc4
      TEST_CAMERA_ID: "00000000-0000-0000-0000-000000000004"
      ALERT_INTERVAL_SECONDS: "8"
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    restart: unless-stopped

  uc1_v2_stub:
    build:
      context: ..
      dockerfile: stubs/uc1_v2/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8021:8021"
    environment:
      REDIS_URL: redis://redis:6379
      TEST_CAMERA_ID: 00000000-0000-0000-0000-000000000001
      REDIS_CONSUMER_GROUP: uc1_v2_group
      REDIS_CONSUMER_NAME: uc1_v2_worker_1
      YOLO_MODEL: yolov8n.pt
      YOLO_CONFIDENCE: "0.35"
    depends_on:
      redis:
        condition: service_healthy
      ingestion:
        condition: service_healthy
    restart: unless-stopped