services:
  uc3_ppe_detection:
    build:
      context: ..
      dockerfile: services/uc3_ppe_detection/Dockerfile
    container_name: innovision-uc3-ppe-detection
    ports:
      - "8040:8040"
    environment:
      - UC3_PORT=8040
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CAMERA_REGISTRY_URL=http://camera_registry:8011
      - UC3_STREAM_GROUP=uc3_compliance_group
      - UC3_EVIDENCE_BUCKET=innovision-evidence
      - UC3_ALERT_COOLDOWN_S=30
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      camera_registry:
        condition: service_started
      ingestion:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
